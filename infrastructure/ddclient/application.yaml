apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ddclient
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/m1dugh/nix-cluster.git
      targetRevision: main
      path: charts/ddclient
      helm:
        valueFiles:
          - $values/infrastructure/ddclient/values.yaml
    - repoURL: https://github.com/m1dugh/nix-cluster.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/m1dugh/nix-cluster.git
      targetRevision: main
      path: infrastructure/ddclient
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
