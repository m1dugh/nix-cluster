apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddclient-cloudflare-api-token
  namespace: default
spec:
  secretStoreRef:
    name: vault-infra
    kind: ClusterSecretStore
  target:
    name: ddclient-cloudflare-api-token-secret
  data:
    - secretKey: api-token
      remoteRef:
        key: ddclient
        property: apiToken
