# No native OIDC support in this chart; unauthenticated at the gateway
# (explicit exception, same category as Vault/Longhorn — see AGENTS.md's
# private-gateway auth standing instruction). KasmVNC itself still has
# its own password (kasmvnc.auth).
kasmvnc:
  enabled: true
  httpRoute:
    enabled: true
    gatewayName: private-gateway
    gatewayNamespace: gateway-system
    sectionName: https
    hostname: server-browser.int.midugh.fr

chromium:
  debug:
    enabled: true
    httpRoute:
      enabled: true
      gatewayName: private-gateway
      gatewayNamespace: gateway-system
      sectionName: https
      hostname: server-browser-cdp.int.midugh.fr

persistence:
  enabled: true
  size: 8Gi
