# No native OIDC support in this chart; unauthenticated at the gateway
# (explicit exception, same category as Vault/Longhorn — see AGENTS.md's
# private-gateway auth standing instruction). The chart's nginx sidecar
# injects KasmVNC's internal credential, so no login is needed.
kasmvnc:
  enabled: true
  httpRoute:
    enabled: true
    gatewayName: private-gateway
    gatewayNamespace: gateway-system
    sectionName: https
    hostname: server-browser.int.midugh.fr

chromium:
  # Sized for a few tabs on the RPi4 nodes (8Gi); the pod idles around 580Mi.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  debug:
    enabled: true
    httpRoute:
      enabled: true
      gatewayName: private-gateway
      gatewayNamespace: gateway-system
      sectionName: https
      hostname: server-browser-cdp.int.midugh.fr

persistence:
  enabled: true
  size: 8Gi
