apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: server-browser
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/m1dugh/server-browser/charts
      chart: server-browser
      targetRevision: 0.1.11
      helm:
        valueFiles:
          - $values/infrastructure/server-browser/values.yaml
    - repoURL: https://github.com/m1dugh/nix-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: chromium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
