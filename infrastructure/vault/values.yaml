# Single replica (standalone mode, server.ha stays disabled - the chart
# default), backed by Longhorn storage instead of the chart's unset
# default storage class.
#
# Vault starts sealed and uninitialized after first deploy; unsealing and
# root token generation (`vault operator init` / `vault operator unseal`)
# is a manual, one-time step against the pod, not managed by this repo.

injector:
  enabled: false

server:
  dataStorage:
    size: 8Gi
    storageClass: longhorn

extraObjects:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: vault
      namespace: vault-system
    spec:
      parentRefs:
        - name: private-gateway
          namespace: gateway-system
          sectionName: http
      hostnames:
        - vault.int.midugh.fr
      rules:
        - backendRefs:
            - name: vault
              port: 8200
