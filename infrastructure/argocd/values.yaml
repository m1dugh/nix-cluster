configs:
  params:
    server.insecure: true
  cm:
    url: https://argocd.int.midugh.fr
    oidc.config: |
      name: Vault
      issuer: https://vault.int.midugh.fr/v1/identity/oidc
      clientID: argocd
      requestedScopes:
        - openid
        - groups
  rbac:
    policy.csv: |
      g, admin, role:admin
    scopes: "[groups]"

global:
  networkPolicy:
    create: false

extraObjects:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd
      namespace: argocd
    spec:
      parentRefs:
        - name: private-gateway
          namespace: gateway-system
          sectionName: https
      hostnames:
        - argocd.int.midugh.fr
      rules:
        - backendRefs:
            - name: argocd-server
              port: 80
