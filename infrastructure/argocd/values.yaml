configs:
  params:
    server.insecure: true

global:
  networkPolicy:
    create: false

extraObjects:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd
      namespace: argocd
    spec:
      parentRefs:
        - name: private-gateway
          namespace: gateway-system
          sectionName: https
      hostnames:
        - argocd.int.midugh.fr
      rules:
        - backendRefs:
            - name: argocd-server
              port: 80
