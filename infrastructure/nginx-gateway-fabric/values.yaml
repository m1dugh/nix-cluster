gateways:
  - name: private-gateway
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    spec:
      gatewayClassName: nginx
      infrastructure:
        parametersRef:
          group: gateway.nginx.org
          kind: NginxProxy
          name: private-gateway-proxy-config
      listeners:
        - name: http
          port: 80
          protocol: HTTP
          allowedRoutes:
            namespaces:
              from: All
        - name: https
          port: 443
          protocol: HTTPS
          hostname: "*.int.midugh.fr"
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: private-gateway-tls
          allowedRoutes:
            namespaces:
              from: All
  - name: public-gateway
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    spec:
      gatewayClassName: nginx
      infrastructure:
        parametersRef:
          group: gateway.nginx.org
          kind: NginxProxy
          name: public-gateway-proxy-config
      listeners:
        - name: http
          port: 80
          protocol: HTTP
          allowedRoutes:
            namespaces:
              from: All
        - name: https
          port: 443
          protocol: HTTPS
          hostname: "*.midugh.fr"
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: public-gateway-tls
          allowedRoutes:
            namespaces:
              from: All

extraObjects:
  - |
    apiVersion: gateway.nginx.org/v1alpha2
    kind: NginxProxy
    metadata:
      name: private-gateway-proxy-config
    spec:
      kubernetes:
        service:
          type: NodePort
          externalTrafficPolicy: Cluster
          nodePorts:
            - listenerPort: 80
              port: 30080
            - listenerPort: 443
              port: 30443
  - |
    apiVersion: gateway.nginx.org/v1alpha2
    kind: NginxProxy
    metadata:
      name: public-gateway-proxy-config
    spec:
      kubernetes:
        service:
          type: NodePort
          externalTrafficPolicy: Cluster
          nodePorts:
            - listenerPort: 80
              port: 31080
            - listenerPort: 443
              port: 31443
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: private-gateway-https-redirect
      namespace: gateway-system
    spec:
      parentRefs:
        - name: private-gateway
          sectionName: http
      rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: public-gateway-https-redirect
      namespace: gateway-system
    spec:
      parentRefs:
        - name: public-gateway
          sectionName: http
      rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301
